services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: cgr.dev/chainguard/minio  # minio/minio removed from Docker Hub
    command: server /data --console-address ":9001"
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on: [postgres, redis, minio]

volumes:
  pgdata:
  miniodata:
