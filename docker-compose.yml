services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: cgr.dev/chainguard/minio  # minio/minio removed from Docker Hub
    command: server /data --console-address ":9001"
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./backend:/app, ./docs:/docs:ro]  # docs: specs read by tests
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

volumes:
  pgdata:
  miniodata:
