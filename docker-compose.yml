services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15

  redis:
    restart: unless-stopped
    image: redis:7
    ports: ["6379:6379"]

  minio:
    restart: unless-stopped
    image: cgr.dev/chainguard/minio  # minio/minio removed from Docker Hub
    command: server /data --console-address ":9001"
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  backend:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./backend:/app, ./docs:/docs:ro, ./data:/data:ro]  # docs: specs read by tests; data: synthetic documents and LLM cache
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    restart: unless-stopped
    build: ./backend
    # migrations run in the backend service; uv run skips the image's alembic entrypoint
    entrypoint: ["uv", "run"]
    command: celery -A app.workers.celery_app worker -l info  # concurrency: celery_app.py
    env_file: .env
    environment:
      OMP_THREAD_LIMIT: "1"  # parallel Tesseract processes must not fight over cores
    volumes: [./backend:/app, ./data:/data]  # /data: LLM cache and daily spend file
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  satellite-worker:  # only the "satellite" queue (celery_app.py task_routes): one check at a time
    restart: unless-stopped
    build: ./backend
    entrypoint: ["uv", "run"]
    command: celery -A app.workers.celery_app worker -l info -Q satellite --concurrency 1 -n satellite@%h
    env_file: .env
    volumes: [./backend:/app]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      sentinel: {condition: service_started}

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_started}

  sentinel:
    restart: unless-stopped
    build: ./sentinel
    env_file: ./sentinel/.env
    ports: ["5060:5060"]
    volumes:
      - ./sentinel/collected:/app/collected
      # Earth Engine login from `earthengine authenticate` on this PC
      - ${USERPROFILE:-~}/.config/earthengine:/root/.config/earthengine:ro

volumes:
  pgdata:
  miniodata:
