# vendored OFL fonts + licenses stay byte-identical to upstream (and exceed the size limit)
exclude: ^ml/synth/fonts/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # keep in sync with ruff in backend/uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Windows Smart App Control blocks the generated .exe shim; run the module instead
        entry: python -m pre_commit_hooks.end_of_file_fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: block-env-file
        name: block committing .env
        entry: ".env holds secrets; commit .env.example instead"
        language: fail
        files: (^|/)\.env$
