# vendored OFL fonts + licenses stay byte-identical to upstream (and exceed the size limit)
exclude: ^ml/synth/fonts/

repos:
  # Windows Smart App Control blocks the python.exe in pre-commit's own venvs, so every hook
  # runs from backend/.venv (ruff and pre-commit-hooks are pinned in backend/uv.lock)
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --project backend python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --project backend python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run --project backend python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run --project backend python -m pre_commit_hooks.check_added_large_files
        language: system
      - id: detect-private-key
        name: detect private key
        entry: uv run --project backend python -m pre_commit_hooks.detect_private_key
        language: system
        types: [text]
      - id: block-env-file
        name: block committing .env
        entry: ".env holds secrets; commit .env.example instead"
        language: fail
        files: (^|/)\.env$
