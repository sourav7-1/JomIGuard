name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_pass
          POSTGRES_DB: jomiguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d jomiguard_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      UV_PYTHON: "3.12"
      # dummy values: tests use TEST_DATABASE_URL and a fake storage, nothing else is contacted
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_only_pass@localhost:5432/jomiguard_test
      DATABASE_URL: postgresql+psycopg://ci:ci_only_pass@localhost:5432/unused
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci_only_pass
      MINIO_BUCKET: documents
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
