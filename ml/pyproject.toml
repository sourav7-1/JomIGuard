[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "albumentations==2.0.8",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
